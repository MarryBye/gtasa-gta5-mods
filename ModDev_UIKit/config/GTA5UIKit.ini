[General]
; Global language for ALL GTA5-style suite mods: rus or eng
Language=rus
; Global speed display unit: mph or kmh
SpeedUnit=mph
; Global UI scale multiplier (0.70 .. 1.40, default 1.0 = exact WidescreenFix vanilla scale)
UIScale=1.0
; Enable diagnostic log file next to GTA5UIKit.asi
EnableLog=1

[Features]
; Restyle ALL remaining vanilla GTA SA CMenuSystem menus (Barbers, Tattoos, Gyms, Betting, Color Grids)
; into our clean monochrome auto-fitting UI Kit style without modifying vanilla script behavior!
RestyleVanillaMenus=1
; Restyle ALL vanilla top-left notification boxes, story phone-call prompts, Yes/No questions & tips
; into our sleek monochrome UI Kit HelpToast component!
RestyleHelpBoxes=1

[Coop]
; Optional custom player profile name for GTA SA COOP per-player saves (Garage, Weapons, Inventory, Wardrobe).
; Leave empty to automatically read your nickname from coop\coop.ini (Karimov-Akbar/sa-coop)!
ProfileName=
