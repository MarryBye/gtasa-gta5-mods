[General]
; Enable modernized Definitive Edition + GTA V style game menus (Main Menu & Pause Menu)
EnableModernMenu=1

; Dark backdrop opacity behind the menu (0..255, default 194)
BackdropOpacity=194

; Show live player overview card (Rank, Cash, Health, Armor, Garage, Arsenal) on Pause root
ShowPlayerCard=1

; Show classic GTA SA artwork subtly behind the Title/Main Menu scrim
ShowClassicTitleArt=1

; Write diagnostics to GTA5ModernMenu.log
EnableLog=1
