; GTA5AmmuNation — Магазин и кастомизация оружия в стиле GTA 5 для GTA San Andreas 1.0 US
; Использует общий UI Kit (ModDev_Common). Совместим с Russificator, Proper Shaders, WidescreenFix, SA-COOP.

[General]
; Язык интерфейса: rus или eng
Language=rus
; Вести лог GTA5AmmuNation.log рядом с плагином
EnableLog=1

[Features]
; Отображать 3D-обвесы (глушитель, компенсатор, коллиматор/оптика, рукоять, магазин, ЛЦУ) прямо на оружии в руках (по умолчанию 0 = выкл)
Enable3DAttachments=0
; 3D-луч лазера (ЛЦУ) и светящаяся точка на цели при прицеливании (ПКМ)
EnableLaserSight=1
; Реальный плавный зум камеры при прицеливании (ПКМ) с коллиматором или оптикой
EnableScopeZoom=1
; Изменённые звуки выстрелов (тихий глушитель, усиленный дульный выстрел с компенсатором/усиленным стволом)
EnableWeaponAudio=1
; Громкость кастомных звуков выстрелов (0.1 - 1.0)
AudioVolume=0.65

[WeaponWheel]
; Ванильное колесо выбора оружия (открывается по колёсику мыши и по удержанию TAB, без замедления времени — 100% SA-COOP)
EnableWeaponWheel=1
; Клавиша удержания детального колеса (9 = TAB, 20 = CapsLock)
WheelKey=9

[Prices]
; Цены на модули (умножаются на класс оружия: пистолеты x1.0, ПП/дробовики x1.2, винтовки/снайперки x1.4)
Suppressor=2200
Compensator=1800
ExtendedMag=1600
DrumMag=3200
ReflexSight=1900
TacticalScope=3400
VerticalGrip=1500
HeavyBarrel=2800
LaserRed=1400
LaserGreen=1800
