; GTA5EarlyUnlock — Открытие всех магазинов, мастерских и сервисов с самого начала игры
; Совместим с GTA5GarageAndTuning, GTA5AmmuNation, сюжетными миссиями и SA-COOP.

[General]
; Вести лог GTA5EarlyUnlock.log рядом с плагином
EnableLog=1

[Unlock]
; Все 5 автомастерских (TransFender LS/SF/LV, Loco Low Co., Wheel Arch Angels) + иконки ключа
UnlockModShops=1
; Все оружейные магазины Ammu-Nation (AMMUN1..AMMUN5)
UnlockAmmuNation=1
; Все магазины одежды (Binco, ProLaps, Sub Urban, ZIP, Victim, Didier Sachs)
UnlockClothes=1
; Все парикмахерские и тату-салоны
UnlockBarbersAndTattoos=1
; Все 3 спортзала (LS, SF, LV)
UnlockGyms=1
; Все закусочные, рестораны, букмекерка и прочие сервисы
UnlockFoodAndMisc=1
; Добавлять иконки на карту для открытых магазинов (без дубликатов!)
AddMapIcons=1
