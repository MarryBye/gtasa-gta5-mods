[General]
; Language: rus or eng (synced automatically with GTA5UIKit.ini if installed)
Language=rus
; Global XP gain multiplier (1.0 = balanced non-grindy Rank 1..25 curve)
XpMultiplier=1.0
; Hotkey to briefly display the top Rank & XP bar on demand (119 = F8, 0 = disable)
PeekKey=119
; Play native GTA SA audio cues for XP gain & Rank Up (1 = enabled, 0 = silent)
EnableSound=1
EnableLog=1
