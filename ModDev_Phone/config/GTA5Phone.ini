[General]
; Language: rus or eng (synced automatically with GTA5UIKit.ini if installed)
Language=rus
; Key to open/close Phone (117 = F6). Automatically takes over F6 from Garage & hides Inventory F7!
PhoneKey=117
EnableLog=1

[Coop]
; Hotkey used by GTA SA COOP to open its Player List (default 113 = F2)
PlayerListKey=113

[Contacts]
; Old Acquaintance (Wanted Star Clear): cooldown in seconds (600 = 10 min, shared in SA-COOP!)
WantedClearCooldownSec=600
; Max wanted stars removed per call (1..6, default 3)
WantedClearMaxStars=3
; Fee per star removed ($500 * stars)
WantedClearCostPerStar=500
; Emergency Paramedic heal cost & cooldown (seconds)
MedicHealCost=400
MedicCooldownSec=180

[Wardrobe]
; Replace vanilla Clothing Store UI (Binco, ProLaps, Sub Urban, ZIP, Victim, Didier Sachs) with UI Kit style
EnableClothesShopUI=1
; Enable automatic Outfit Preset swapping (On Mission / Free Roam / When Wanted)
EnableAutoOutfits=1

[Settings]
; 1990s LCD screen theme: 0=ClassicSA, 1=Nokia92 Green, 2=Amber90s, 3=NightBlue
Theme=0
; Synthesized 1990s ringtone: 0=Classic, 1=RetroBeep, 2=Melody92, 3=USRing
Ringtone=0
; Keypad beep tones (1=On, 0=Off)
KeyBeeps=1
; Native GTA SA CJ brick cell phone hand animation while on foot (1=On, 0=Off)
PhoneAnim=1
; Silent mode mutes keypad & ringtone audio (0=Off, 1=On)
SilentMode=0
