; GTA 5 Tuning & Mechanic Delivery for GTA San Andreas 1.0 US
; Совместим с Russificator, Proper Shaders, ModelExtras, Izzy's Lively Vehicle Physics,
; Proper Vehicle Damage, WidescreenFix и SA-COOP.

[General]
; Язык интерфейса: rus или eng
Language=rus
; Единицы скорости на панели характеристик: mph (под SA Styled Speedometer) или kmh
SpeedUnit=mph
; Клавиша открытия меню вызова транспорта (117 = F6)
CallMenuKey=117
; Максимум личных машин в гараже (до 10, по 5 на страницу)
MaxVehicles=10
; Вести лог GTA5GarageAndTuning.log рядом с плагином
EnableLog=1
; (Разблокировка автомастерских и всех магазинов вынесена в отдельный мод GTA5EarlyUnlock!)

[Delivery]
; Дистанция спавна машины с механиком (в метрах)
SpawnDistance=100.0
; Максимальное расстояние до ближайшей дороги (если дальше — «в поле», вызвать нельзя)
MaxRoadDistance=45.0
; Разрешить доставку во время миссий (0 = нет, 1 = да)
AllowOnMission=1

[Insurance]
; Процент от денег игрока за восстановление уничтоженной машины (например 5 = 5%)
RestorePercent=5
; Минимальная и максимальная сумма восстановления для баланса
MinRestoreCost=500
MaxRestoreCost=25000

[Effects]
; Мягкий звук турбины и пшик блоу-офф (через bass.dll)
EnableTurboAudio=1
; Более выразительный и агрессивный тембр выхлопа/двигателя при прокачке Двигателя 1-4
EnableEngineTone=1

