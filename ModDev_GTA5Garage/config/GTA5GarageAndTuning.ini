[General]
; Language: rus or eng (automatically synced with GTA5UIKit.ini if GTA5UIKit.asi is installed)
Language=rus
; Speed display unit: mph or kmh
SpeedUnit=mph
; Standalone Mechanic menu hotkey when GTA5Phone.asi is NOT installed (117 = F6)
CallMenuKey=117
; Max personal garage slots (1..10)
MaxVehicles=10
EnableLog=1

[Delivery]
SpawnDistance=100.0
MaxRoadDistance=45.0
AllowOnMission=1

[Insurance]
RestorePercent=5
MinRestoreCost=500
MaxRestoreCost=25000

[Wear]
; ETS 2-style per-part mechanical wear system (Engine, Transmission, Brakes, Tires, Suspension, Chassis)
EnableWearSystem=1
; Speed of wear accumulation (1.0 = balanced, 0.5 = slower, 2.0 = faster)
WearRateMultiplier=1.0
; Maintenance & overhaul price multiplier (1.0 = expensive realistic servicing)
MaintenanceCostMultiplier=1.0
BaseOverhaulEngine=14000
BaseOverhaulTrans=10500
BaseOverhaulBrakes=7000
BaseOverhaulTires=6500
BaseOverhaulSusp=8500
BaseOverhaulChassis=11500

[Dealership]
; Official 3-city Car Dealerships (Coutt & Schutz LS, Wang Cars SF, Auto Bahn LV) + Phone Dealership
EnableDealership=1
PriceMultiplier=1.0

