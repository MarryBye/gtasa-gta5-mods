[General]
; Language: rus or eng (synced automatically with GTA5UIKit.ini if installed)
Language=rus
; Standalone hotkey to open Pocket Inventory (118 = F7).
; Automatically disabled when GTA5Phone.asi is installed (use Phone F6 instead)!
OpenKey=118
; Allow buying spare body armor inside restaurant/shop take-out menus (0 = Ammu-Nation ONLY, 1 = also in restaurants)
AllowArmorInFoodShops=0
; Total shared carry capacity for pocket snacks/meals (default 20)
MaxFoodCapacity=20
; Total shared carry capacity for spare body armor (default 10)
MaxArmorCapacity=10
; Multiplier for GTA SA fat gain when eating pocket food (1.0 = balanced vanilla obesity, 0.0 = disable)
FatGainMultiplier=1.0
EnableLog=1

